name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is needed to tell whether this push changed the version.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies --out git-fleet.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: git-fleet-vsix
          path: git-fleet.vsix

      # A release is cut only when the version actually moved, so ordinary
      # commits to main stay green and produce just the build artifact.
      - name: Did the version change?
        id: check
        run: |
          NEW=$(node -p "require('./package.json').version")
          OLD=$(git show HEAD^:package.json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=${OLD:-<none>} new=$NEW"

          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is still $NEW, so no release was cut. Bump it with scripts/bump.ps1."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
            exit 0
          fi
          mv git-fleet.vsix "git-fleet-$VERSION.vsix"
          gh release create "v$VERSION" "git-fleet-$VERSION.vsix" \
            --title "v$VERSION" \
            --notes "Install with: code --install-extension git-fleet-$VERSION.vsix"
