name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies --out git-fleet.vsix

      - name: Attach the VSIX to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: git-fleet.vsix

      # Only runs once VSCE_PAT is set in the repository secrets. Publishing to
      # the Marketplace is what makes Settings Sync carry the extension to
      # another machine; without it the VSIX above is a manual install.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath git-fleet.vsix
